[build]
builder = "dockerfile"
buildCommand = "docker build -f PHP.Dockerfile ."

[deploy]
startCommand = "nginx -g 'daemon off;'"
healthcheckPath = "/"
healthcheckTimeout = 300
restartPolicyType = "on_failure"
restartPolicyMaxRetries = 5
preDeployCommand = ["composer install --no-dev --optimize-autoloader"]